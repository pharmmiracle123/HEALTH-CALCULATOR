<!doctype html><html lang="en"><head><title>Sign in · Miracardiac</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6f73"><link rel="manifest" href="public/manifest.webmanifest"><link rel="icon" href="public/icon-192.svg"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif'],display:['Manrope','sans-serif']},colors:{teal:'#0b6f73',ink:'#172b3b'}}}};</script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>body{background:radial-gradient(circle at 80% 0,#eaf8f5,transparent 26rem),#f5f8fb}.glass{background:#ffffffdd;backdrop-filter:blur(12px)}.toast{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style></head><body class="min-w-[320px] text-ink font-sans"><main class="grid min-h-screen place-items-center px-5 py-12"><div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl"><a href="index.html" class="text-xs font-bold text-teal">← Back to Miracardiac</a><div class="mt-8"><p class="text-[10px] font-extrabold tracking-widest text-teal">SECURE WORKSPACE ACCESS</p><h1 class="mt-2 font-display text-3xl font-extrabold">Welcome back</h1><p class="mt-2 text-sm text-slate-500">Use demo mode now, or connect Firebase Auth in this page.</p></div><form id="login" class="mt-8 grid gap-4"><label class="text-xs font-bold">Email<input name="email" type="email" required placeholder="you@clinic.org" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm"></label><label class="text-xs font-bold">Password<input name="password" type="password" required placeholder="••••••••" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm"></label><button class="rounded-xl bg-teal py-3 text-sm font-bold text-white">Continue securely →</button></form><button id="demo" class="mt-3 w-full rounded-xl border border-slate-200 py-3 text-xs font-bold text-slate-500">Continue in demo mode</button><p class="mt-6 text-center text-[10px] leading-relaxed text-slate-400">Clinical decision support only. Always verify local policy and patient context.</p></div></main><script>const CONFIG={firebase:{apiKey:'',authDomain:'',projectId:'',storageBucket:'',messagingSenderId:'',appId:''},cloudinary:{cloudName:'',uploadPreset:''}};const $=s=>document.querySelector(s);const toast=(x,b=false)=>{let n=document.createElement('div');n.className='toast fixed bottom-5 right-5 z-50 rounded-xl px-4 py-3 text-xs text-white shadow-2xl '+(b?'bg-red-700':'bg-[#183b4a]');n.textContent=x;document.body.append(n);setTimeout(()=>n.remove(),3500)};if($('#logout'))$('#logout').onclick=()=>{localStorage.removeItem('mc-user');location.href='login.html'};if($('#user-pill'))$('#user-pill').textContent=localStorage.getItem('mc-user')||'Guest mode';if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('public/sw.js').catch(()=>{}));$('#login').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);localStorage.setItem('mc-user',d.get('email'));location.href='dashboard.html'};$('#demo').onclick=()=>{localStorage.setItem('mc-user','Demo care team');location.href='dashboard.html'};</script></body></html>
